<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오빠 지갑 광클 챌린지 💸</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 스트레스 확 풀리는 팝한 컬러 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Jua', sans-serif;
            overflow: hidden;
            text-align: center;
            user-select: none; /* 광클할 때 글씨 드래그 방지 */
            -webkit-user-select: none;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.2);
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        h1 {
            color: #ff4757;
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        p.desc {
            color: #57606f;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .status-board {
            display: flex;
            justify-content: space-between;
            background: #f1f2f6;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 1.5rem;
            color: #2f3542;
            font-weight: bold;
        }

        #timer { color: #ff4757; }
        #score { color: #1e90ff; }

        /* 광클할 지갑 버튼 */
        .wallet-btn {
            font-size: 5rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.05s;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            -webkit-tap-highlight-color: transparent; /* 모바일 터치 시 파란 배경 방지 */
        }

        .wallet-btn:active {
            transform: scale(0.85); /* 누를 때마다 쫀득하게 줄어듦 */
        }

        /* 덜덜 떨리는 애니메이션 (광클 시) */
        .shake {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 결과창 (처음엔 숨김) */
        #result-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        #result-title {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #result-msg {
            font-size: 1.3rem;
            color: #2f3542;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .restart-btn {
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            padding: 10px 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>지갑 털기 광클 챌린지 💳</h1>
        <p class="desc">야자 스트레스? 지갑을 미친듯이 눌러라!<br><b>제한시간 5초!</b> 첫 클릭 시 시작됨 ㅋ</p>

        <div class="status-board">
            <div>⏱ <span id="timer">5.0</span>초</div>
            <div>🔥 <span id="score">0</span>타</div>
        </div>

        <button class="wallet-btn" id="wallet" onclick="hitWallet()">👛</button>

        <div id="result-modal">
            <div id="result-title">결과</div>
            <div id="result-msg">메시지</div>
            <p style="color:#ff4757; font-size:1rem;">(이 화면 캡처해서 오빠한테 카톡 ㄱㄱ)</p>
            <button class="restart-btn" onclick="resetGame()">다시 도전 ㅋ</button>
        </div>
    </div>

    <script>
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const walletBtn = document.getElementById('wallet');
        const resultModal = document.getElementById('result-modal');
        const resultTitle = document.getElementById('result-title');
        const resultMsg = document.getElementById('result-msg');

        let score = 0;
        let timeLeft = 5.0;
        let isPlaying = false;
        let isEnded = false;
        let timerId;

        function hitWallet() {
            if (isEnded) return;

            // 첫 번째 클릭 시 게임 시작
            if (!isPlaying) {
                isPlaying = true;
                startGame();
            }

            score++;
            scoreEl.innerText = score;

            // 누를 때마다 지갑이 덜덜 떨리는 효과
            walletBtn.classList.add('shake');
            setTimeout(() => {
                walletBtn.classList.remove('shake');
            }, 50);
        }

        function startGame() {
            timerId = setInterval(() => {
                timeLeft -= 0.1;
                timerEl.innerText = timeLeft.toFixed(1);

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 100);
        }

        function endGame() {
            clearInterval(timerId);
            isPlaying = false;
            isEnded = true;
            timerEl.innerText = "0.0";
            
            // 점수에 따른 남매 츤데레 결과 판정
            if (score >= 60) {
                resultTitle.innerText = "🏆 미친 피지컬 ㄷㄷ";
                resultTitle.style.color = "#ff4757";
                resultMsg.innerHTML = "손가락 모터 달았냐? ㅋㅋㅋㅋ<br>인정한다. 마라탕에 꿔바로우 세트 쏜다!<br>고생했다 울 동생 🥰
