<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오빠 지갑 털기 대작전 💳</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Jua', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #5f2c82;
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        p.desc {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* 게이지 바 스타일 */
        .gauge-container {
            width: 100%;
            height: 40px;
            background-color: #ddd;
            border-radius: 20px;
            position: relative;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
        }

        /* 대박 존 (가운데) */
        .golden-zone {
            position: absolute;
            left: 40%;
            width: 20%;
            height: 100%;
            background-color: #ff9a9e;
            z-index: 1;
        }

        /* 중박 존 (가운데 양옆) */
        .silver-zone {
            position: absolute;
            left: 20%;
            width: 60%;
            height: 100%;
            background-color: #fecfef;
            z-index: 0;
        }

        /* 왔다 갔다 하는 커서 */
        .cursor {
            position: absolute;
            top: -5px;
            left: 0;
            width: 10px;
            height: 50px;
            background-color: #5f2c82;
            border-radius: 5px;
            z-index: 2;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .stop-btn {
            font-family: 'Jua', sans-serif;
            font-size: 1.5rem;
            padding: 15px 40px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .stop-btn:active {
            transform: scale(0.95);
        }

        #result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff;
            border: 2px dashed #ff9a9e;
            border-radius: 15px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #result-title {
            font-size: 1.8rem;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        #result-msg {
            font-size: 1.2rem;
            color: #333;
            line-height: 1.5;
        }

        .reset-btn {
            margin-top: 15px;
            font-family: 'Jua', sans-serif;
            font-size: 1.1rem;
            padding: 8px 20px;
            background-color: #eee;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>오빠 카드 찬스! 💳</h1>
        <p class="desc">야자하느라 고생하는 고딩!<br>타이밍 맞춰서 오빠 지갑을 털어봐 😎</p>

        <div class="gauge-container">
            <div class="silver-zone"></div>
            <div class="golden-zone"></div>
            <div class="cursor" id="cursor"></div>
        </div>

        <button class="stop-btn" id="action-btn" onclick="stopCursor()">여기다! 멈춰!</button>

        <div id="result-box">
            <div id="result-title">결과</div>
            <div id="result-msg">메시지</div>
            <button class="reset-btn" onclick="resetGame()">다시 도전 ㅋ</button>
        </div>
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const actionBtn = document.getElementById('action-btn');
        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');
        const resultMsg = document.getElementById('result-msg');

        let position = 0;
        let direction = 1;
        let speed = 2.5; // 속도 (숫자가 클수록 빠름)
        let animationId;
        let isRunning = true;

        function moveCursor() {
            if (!isRunning) return;

            position += direction * speed;
            
            // 양끝에 닿으면 방향 전환
            if (position >= 96 || position <= 0) {
                direction *= -1;
            }

            cursor.style.left = position + '%';
            animationId = requestAnimationFrame(moveCursor);
        }

        // 게임 시작
        moveCursor();

        function stopCursor() {
            if (!isRunning) return;
            
            isRunning = false;
            cancelAnimationFrame(animationId);
            actionBtn.style.display = 'none';

            // 결과 판정 (가운데 40~60%가 대박존, 20~80%가 중박존)
            if (position >= 40 && position <= 60) {
                resultTitle.innerText = "🎉 대박 당첨!!";
                resultTitle.style.color = "#ff6b6b";
                resultMsg.innerHTML = "오? 타이밍 미쳤고 ㅋㅋㅋ<br>마라탕에 탕후루 풀코스로 쏜다!!<br>먹고 싶은 거 톡으로 보내라 🥰";
            } else if (position >= 20 && position <= 80) {
                resultTitle.innerText = "✨ 평타 쳤다!";
                resultTitle.style.color = "#4facfe";
                resultMsg.innerHTML = "까비~ 그래도 이 정도면 봐준다.<br>편의점 가서 떡볶이랑 과자 골라라!<br>야자 파이팅하고 💪";
            } else {
                resultTitle.innerText = "💥 꽝 ㅋㅋㅋㅋ";
                resultTitle.style.color = "#5f2c82";
                resultMsg.innerHTML = "아이고 느려 터졌네 ㅋㅋㅋ 으이구!<br>오빠 지갑은 안전하다 휴~<br>...는 장난이고 아이스크림은 사줄게 🍦";
            }

            resultBox.style.display = 'block';
        }

        function resetGame() {
            isRunning = true;
            resultBox.style.display = 'none';
            actionBtn.style.display = 'inline-block';
            position = 0;
            direction = 1;
            // 다시 할 때마다 아주 살짝씩 빨라지게 장난치기
            speed = Math.min(speed + 0.5, 6); 
            moveCursor();
        }
    </script>
</body>
</html>
