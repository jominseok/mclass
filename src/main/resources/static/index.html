<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 콜? ⚾</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
            align-items: center;
        }

        button {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        #btn-yes {
            background-color: #0984e3;
            color: white;
            box-shadow: 0 4px 15px rgba(9, 132, 227, 0.3);
            transition: transform 0.2s;
        }

        #btn-yes:hover {
            transform: scale(1.1);
        }

        #btn-no {
            background-color: #dfe6e9;
            color: #636e72;
            /* transform을 사용하면 프레임 드랍 없이 아주 부드럽게 이동합니다 */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            z-index: 100;
        }

        #success-msg {
            display: none;
            font-size: 1.5rem;
            color: #00b894;
            font-weight: bold;
            margin-top: 20px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1 id="main-title">오늘 저녁에 야구 볼까? ⚾</h1>
        <p id="subtitle">분위기 좋은 펍에서 치맥 콜? 🍗🍻</p>
        
        <div class="btn-group" id="buttons">
            <button id="btn-yes" onclick="sayYes()">콜! 좋아 💖</button>
            <button id="btn-no" onmouseover="runAway()" onclick="runAway()">안돼 🙅‍♀️</button>
        </div>

        <div id="success-msg">나이스! 이따 봐요 🥰</div>
    </div>

    <script>
        function runAway() {
            const btn = document.getElementById('btn-no');
            
            // 화면 크기를 기준으로 이동할 랜덤 거리 계산 (너무 멀리 안가게 80% 반경 내에서)
            const windowWidth = window.innerWidth * 0.8;
            const windowHeight = window.innerHeight * 0.8;
            
            // 현재 위치에서 상하좌우 랜덤하게 이동
            const randomX = (Math.random() - 0.5) * windowWidth;
            const randomY = (Math.random() - 0.5) * windowHeight;
            
            // transform: translate를 사용해 아주 스무스하게 미끄러지듯 이동
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function sayYes() {
            document.getElementById('buttons').style.display = 'none';
            document.getElementById('subtitle').style.display = 'none';
            // 성공 시 펍 관련 멘트로 변경!
            document.getElementById('main-title').innerText = "분위기 좋은 펍 예약 완료! 🍻";
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>

</body>
</html>
